<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://open.er-api.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="代購帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f1f4f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1513" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>代購帳</title>
<style>
/* 版面：單欄手機優先，頂部行程切換，底部五個分頁，表單用底部抽屜 */
:root{
  --bg:#f1f4f3; --surface:#ffffff; --surface2:#e6ecea; --fg:#14201c; --muted:#5b6a65; --line:#d8e0dd;
  --accent:#0b6bcb; --accent-fg:#ffffff; --accent-bg:#e0edfa;
  --good:#1b7f45; --good-bg:#dff2e6; --warn:#a65f00; --warn-bg:#fcefd3; --bad:#b83225; --bad-bg:#fbe3df;
  --shadow:0 1px 2px rgba(20,32,28,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1513; --surface:#18211e; --surface2:#222d29; --fg:#e8efec; --muted:#93a39d; --line:#2a3732;
    --accent:#5aa2ee; --accent-fg:#06111c; --accent-bg:#14263a;
    --good:#58c487; --good-bg:#13281d; --warn:#e3a649; --warn-bg:#2d2310; --bad:#f0857a; --bad-bg:#31171a;
    --shadow:none; color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;font-variant-numeric:tabular-nums;touch-action:manipulation}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:640px;margin:0 auto;min-height:100dvh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:10px;align-items:center;
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid var(--line)}
header select{flex:1;min-width:0;font-weight:600;font-size:16px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
header .brand{font-weight:800;letter-spacing:.02em}
main{padding:14px 16px 64px;display:flex;flex-direction:column;gap:10px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{border:0;background:none;padding:12px 2px 11px;font-size:13px;color:var(--muted);position:relative;font-weight:600}
nav button.on{color:var(--accent)}
nav button.on::before{content:"";position:absolute;left:28%;right:28%;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
nav .bd{display:inline-block;min-width:18px;padding:0 5px;margin-left:3px;border-radius:9px;background:var(--accent);color:var(--accent-fg);font-size:11px;line-height:18px}
h2{font-size:13px;margin:6px 0 0;color:var(--muted);font-weight:700;letter-spacing:.06em}
h3{margin:0;font-size:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.sub{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{color:var(--muted);font-size:13px;margin:4px 0}
.empty{text-align:center;color:var(--muted);padding:36px 12px;line-height:1.7}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:5;
  box-shadow:0 4px 14px rgba(0,0,0,.25);border-radius:28px;padding:14px 20px;background:var(--accent);color:var(--accent-fg);border:0;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;border:0}
.p-none{background:var(--bad-bg);color:var(--bad)} .p-part{background:var(--warn-bg);color:var(--warn)} .p-paid{background:var(--good-bg);color:var(--good)}
.s-no{background:var(--surface2);color:var(--muted)} .s-yes{background:var(--good-bg);color:var(--good)}
.item{display:flex;gap:10px;align-items:center}
.chk{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:var(--surface);color:var(--accent-fg);font-weight:800;flex:none;padding:0}
.chk.on{background:var(--good);border-color:var(--good)}
.thumb{width:56px;height:56px;border-radius:10px;background:var(--surface2) center/cover no-repeat;flex:none;display:grid;place-items:center;color:var(--muted);font-size:11px}
.nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr{font-weight:800;font-size:16px;text-align:right;flex:none}
.order .top{display:flex;justify-content:space-between;gap:8px;font-size:16px}
.order .amt{font-weight:800}
.order .chips{margin-top:8px;align-items:center}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:19px;margin-top:2px}
.stat.big{grid-column:1/-1;background:var(--accent-bg);border-color:transparent}
.stat span{font-size:12px;color:var(--muted)}
#sheetWrap{position:fixed;inset:0;z-index:20;display:none;background:rgba(0,0,0,.5)}
#sheetWrap.open{display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:94dvh;overflow:auto;border-radius:20px 20px 0 0;
  padding:16px max(16px,env(safe-area-inset-left,0px)) 0;overscroll-behavior:contain}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.x{border:0;background:none;color:var(--muted);font-weight:600;padding:6px}
.f{display:block;margin:0 0 12px}
.f>span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:600}
.f input,.f select,.f textarea,.inp{width:100%;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.f textarea{min-height:76px;resize:vertical}
.chkrow{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.chkrow input{width:22px;height:22px;flex:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:11px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{border:0;background:none;padding:9px 4px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.photo{display:grid;place-items:center;aspect-ratio:4/3;max-height:260px;width:100%;border-radius:14px;background:var(--surface2) center/cover no-repeat;
  color:var(--muted);font-weight:600;margin-bottom:12px;cursor:pointer;border:1px dashed var(--line)}
.calc{background:var(--bg);border-radius:12px;padding:12px;margin-bottom:12px}
.calc .big{font-size:26px;font-weight:800}
.actions{position:sticky;bottom:0;background:var(--surface);display:flex;gap:10px;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);margin-top:6px}
.actions .btn{flex:1}
.line{display:grid;grid-template-columns:76px 1fr 34px;gap:6px;margin-bottom:12px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.line select{grid-column:1/-1}
.vrow{display:grid;grid-template-columns:1fr 76px 34px;gap:6px;margin-bottom:8px;align-items:center}
.vrow input{width:100%;min-width:0;font-size:15px;padding:9px 8px;border-radius:9px;border:1px solid var(--line);background:var(--bg)}
.vrow .rm{border:0;background:none;color:var(--bad);font-size:20px;padding:0}
.line select,.line input{width:100%;font-size:15px;padding:9px 8px;border-radius:9px;border:1px solid var(--line);background:var(--bg);min-width:0}
.line .rm{border:0;background:none;color:var(--bad);font-size:20px;padding:0}
.expwrap{background:var(--surface2);border-radius:12px;padding:8px;margin-bottom:10px}
.expwrap img{display:block;width:100%;max-width:100%;border-radius:8px}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;background:var(--fg);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14px;max-width:88vw;text-align:center}
.rate{display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rate:last-child{border:0}
.warn{background:var(--warn-bg);color:var(--warn);padding:10px 12px;border-radius:10px;font-size:13px}
.good{background:var(--good-bg);color:var(--good);padding:10px 12px;border-radius:10px;font-size:13px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheetWrap"><div class="sheet" id="sheet"></div></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script src="cards.js"></script>
<script src="app.js"></script>
</body>
</html>
